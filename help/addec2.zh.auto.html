<header>添加现有系统</header>该页面允许您将运行在Amazon EC2服务上的现有系统置于Cloudmin的控制之下，以便可以从中央控制台管理其Virtualmin域。自然，只能添加由在<a href=ec2s>EC2帐户</a>页面上向Cloudmin注册的帐户创建的EC2实例。表单上显示的字段是： <dl><include add><dt> <b>EC2帐户</b> <dd>从此菜单中，您必须选择拥有EC2实例的Amazon帐号。 <dt> <b>EC2实例ID</b> <dd>如果您有一个EC2帐户，则此字段将是一个菜单，用于选择该帐户所拥有的无管理实例。如果存在多个帐户，这将是一个文本字段，用于输入实例ID，或从单击<b>...</b>按钮时出现的弹出窗口中选择它。 </dl><footer>
