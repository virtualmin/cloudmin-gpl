<header>添加現有系統</header>該頁面允許您將運行在Amazon EC2服務上的現有系統置於Cloudmin的控制之下，以便可以從中央控制台管理其Virtualmin域。自然，只能添加由在<a href=ec2s>EC2帳戶</a>頁面上向Cloudmin註冊的帳戶創建的EC2實例。表單上顯示的字段是： <dl><include add><dt> <b>EC2帳戶</b> <dd>從此菜單中，您必須選擇擁有EC2實例的Amazon帳號。 <dt> <b>EC2實例ID</b> <dd>如果您有一個EC2帳戶，則此字段將是一個菜單，用於選擇該帳戶所擁有的無管理實例。如果存在多個帳戶，這將是一個文本字段，用於輸入實例ID，或從單擊<b>...</b>按鈕時出現的彈出窗口中選擇它。 </dl><footer>
