<header>添加现有的VServer </header>该页面允许您在Cloudmin的控制下将在Linux VServer实例中运行的现有系统带入，以便可以从中央控制台管理其Virtualmin域。只能添加已在“ <a href=vservers>VServer主机系统”</a>页面上添加的<a href=vservers>主机系统</a>上的区域。表单上显示的字段是： <dl><include add><dt> <b>VServer托管系统</b> <dd>从此菜单中，您必须选择托管实例的计算机。 <dt> <b>VServer实例名称</b> <dd>如果您具有单个主机系统，则此字段将是用于选择该主机上无管理实例的菜单。如果存在多个主机，则这将是一个文本字段，用于输入实例名称，或从单击<b>...</b>按钮时出现的弹出窗口中选择它。 </dl><footer>
