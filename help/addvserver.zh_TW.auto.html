<header>添加現有的VServer </header>該頁面允許您在Cloudmin的控制下將在Linux VServer實例中運行的現有系統帶入，以便可以從中央控制台管理其Virtualmin域。只能添加已在“ <a href=vservers>VServer主機系統”</a>頁面上添加的<a href=vservers>主機系統</a>上的區域。表單上顯示的字段是： <dl><include add><dt> <b>VServer託管系統</b> <dd>從此菜單中，您必須選擇託管實例的計算機。 <dt> <b>VServer實例名稱</b> <dd>如果您具有單個主機系統，則此字段將是用於選擇該主機上無管理實例的菜單。如果存在多個主機，則這將是一個文本字段，用於輸入實例名稱，或從單擊<b>...</b>按鈕時出現的彈出窗口中選擇它。 </dl><footer>
