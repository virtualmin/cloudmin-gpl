<header>Access key or OAuth client ID</header>

<ul>
<li>S3: access key ID.</li>
<li>Backblaze B2: application key ID.</li>
<li>Google Cloud Storage or Drive: OAuth client ID.</li>
<li>Dropbox: app key.</li>
</ul>

<p>Supply the matching secret. Google and Dropbox also need a refresh token for
the same application and account.</p>
