<header>添加CGE项目</header>使用Google的Compute Engine服务注册帐户和项目后，您就可以使用此页面向Cloudmin注册该项目。必须使用<b>Google帐户</b>字段输入您的帐户电子邮件地址，该地址通常类似于<tt>you@gmail.com</tt> 。并且“ <b>项目名称”</b>字段必须包含您唯一的GCE项目ID。 <p>当您授予对项目的API访问权限时，必须根据Google提供的OAuth令牌填写其余字段，如<a href=http://www.virtualmin.com/documentation/cloudmin/vm/gce-account target=_blank>添加GCE项目</a>文档页面中所述。 <p>当您单击<b>Create时</b> ，Cloudmin将提示您输入其他OAuth令牌，然后验证所有项目详细信息。该项目随后可用于创建GCE实例。 <p><footer>
