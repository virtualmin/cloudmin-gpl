<header>添加CGE項目</header>使用Google的Compute Engine服務註冊帳戶和項目後，您就可以使用此頁面向Cloudmin註冊該項目。必須使用<b>Google帳戶</b>字段輸入您的帳戶電子郵件地址，該地址通常類似於<tt>you@gmail.com</tt> 。並且“ <b>項目名稱”</b>字段必須包含您唯一的GCE項目ID。 <p>當您向項目授予API訪問權限時，必鬚根據Google提供的OAuth令牌填寫其餘字段，如<a href=http://www.virtualmin.com/documentation/cloudmin/vm/gce-account target=_blank>添加GCE項目</a>文檔頁面中所述。 <p>當您單擊<b>Create時</b> ，Cloudmin將提示您輸入其他OAuth令牌，然後驗證所有項目詳細信息。該項目隨後可用於創建GCE實例。 <p><footer>
