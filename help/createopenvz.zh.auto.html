<header> OpenVZ主机系统</header>在Cloudmin可以使用OpenVZ容器创建任何虚拟系统之前，必须使用此页面注册运行OpenVZ的主机系统。 Cloudmin具有三层体系结构，其中主系统（运行Cloudmin Webmin接口的主系统）与托管容器的系统是分开的，容器又与OpenVZ系统本身分开。 <p>在此处可以注册OpenVZ主机系统之前，必须首先使用左侧菜单“ <b>添加系统</b> ”下的“ <b>添加物理系统”</b>链接将其置于Cloudmin的控制之下。 <p>一旦Cloudmin知道了系统，请使用“ <b>为OpenVZ注册系统”托管</b>链接开始注册过程。 <p><footer>
