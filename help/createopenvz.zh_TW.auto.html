<header> OpenVZ主機系統</header>在Cloudmin可以使用OpenVZ容器創建任何虛擬系統之前，必須使用此頁面註冊運行OpenVZ的主機系統。 Cloudmin具有三層體系結構，其中主系統（運行Cloudmin Webmin界面的主系統）與承載容器的系統是分開的，容器又與OpenVZ系統本身分開。 <p>在此處可以註冊OpenVZ主機系統之前，必須首先使用左側菜單“ <b>添加系統</b> ”下的“ <b>添加物理系統”</b>鏈接將其置於Cloudmin的控制之下。 <p>一旦Cloudmin知道了系統，請使用“ <b>為OpenVZ註冊系統”託管</b>鏈接開始註冊過程。 <p><footer>
