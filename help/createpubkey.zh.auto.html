<header>添加SSH公钥</header>该页面允许您将现有的SSH公钥添加到Cloudmin，用作新创建的虚拟系统上的辅助密钥。您必须输入密钥说明，然后<b>为“公共密钥来源</b> ”选择以下选项之一： <dl><dt> <b>在现有文件中</b> <dd>将使用输入到相邻文本字段中的服务器上文件中的密钥。您只需要输入私钥-Cloudmin会自动从中计算公钥。但是，此密钥不能用密码短语保护。 <dt> <b>在上传的文件中</b> <dd>与上一个选项类似，但是私钥可以位于从运行浏览器的系统上载的文件中。 <dt> <b>粘贴到下面的文本框中</b> <dd>与最后两个选项类似，但是必须将私钥数据复制并粘贴到文本框中。 </dl><footer>
