<header>添加SSH公鑰</header>該頁面允許您向Cloudmin添加現有的SSH公共密鑰，以用作新創建的虛擬系統上的輔助密鑰。您必須輸入密鑰說明，然後<b>為“公共密鑰來源</b> ”選擇以下選項之一： <dl><dt> <b>在現有文件中</b> <dd>將使用輸入到相鄰文本字段中的服務器上文件中的密鑰。您只需要輸入私鑰-Cloudmin會自動從中計算公鑰。但是，此密鑰不能用密碼短語保護。 <dt> <b>在上傳的文件中</b> <dd>與上一個選項類似，但是私鑰可以位於從運行瀏覽器的系統上載的文件中。 <dt> <b>粘貼到下面的文本框中</b> <dd>與最後兩個選項類似，但是必須將私鑰數據複製並粘貼到文本框中。 </dl><footer>
