<header>添加磁盘设备</header>该页面允许您使用主机系统上的现有文件或真实设备将新的虚拟磁盘添加到系统。如果您已经拥有另一个系统中的文件，则前者很有用-但不要尝试使同一磁盘同时供两个正在运行的系统使用，因为这会导致数据损坏。 <p>添加真实设备可用于授予对CD或DVD驱动器的访问权限，或者用于将LVM卷甚至真实分区映射到虚拟系统以提高性能。 <p>如果要使用新文件系统重新格式化现有磁盘，请从文件系统中选择<b>要在新磁盘上创建</b>的类型。如果还希望将其安装在虚拟系统上，请在“将<b>新磁盘安装为”</b>字段中输入安装目录。 <p>如果系统当前正在运行，则在下一次重新启动之前，更改将不会完全应用。否则，它们将在启动时应用。 <p><footer>
