<header>添加磁盤設備</header>該頁面允許您使用主機系統上的現有文件或真實設備將新的虛擬磁盤添加到系統。如果您已經擁有另一個系統中的文件，則前者很有用-但不要嘗試使同一磁盤同時供兩個正在運行的系統使用，因為這會導致數據損壞。 <p>添加真實設備可用於授予對CD或DVD驅動器的訪問權限，或者用於將LVM卷甚至真實分區映射到虛擬系統以提高性能。 <p>如果要使用新文件系統重新格式化現有磁盤，請從文件系統中選擇<b>要在新磁盤上創建</b>的類型。如果還希望將其安裝在虛擬系統上，請在“將<b>新磁盤安裝為”</b>字段中輸入安裝目錄。 <p>如果系統當前正在運行，則在下一次重新啟動之前，更改將不會完全應用。否則，它們將在啟動時應用。 <p><footer>
