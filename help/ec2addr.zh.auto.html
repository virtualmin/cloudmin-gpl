<header>分配EC2地址</header>一旦您请求了一个或多个EC2静态IP地址（在“ <b>EC2静态IP地址”</b>页面上），就可以在该页面上为现有实例分配一个。 <b>只需</b>从<b>IP地址中</b>选择<b>要分配的</b>菜单，然后单击表单底部的按钮即可。由于需要调整Amazon网络中的路由，因此可能需要花费几分钟才能完全应用。在这段时间内，可能无法在旧地址或新地址上从外部访问该系统。 <p>如果所选系统已经分配了静态地址，则可以通过从菜单中选择“ <b>无”</b>选项将其删除。 EC2将为系统选择一个新的动态地址（该地址可能与原始地址不同），并在几分钟内分配它。 <p><footer>
