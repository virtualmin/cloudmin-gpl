<header>分配EC2地址</header>一旦您請求了一個或多個EC2靜態IP地址（在“ <b>EC2靜態IP地址”</b>頁面上），就可以在該頁面上為現有實例分配一個。 <b>只需</b>從<b>IP地址中</b>選擇<b>要分配的</b>菜單，然後單擊表單底部的按鈕即可。由於需要調整Amazon網絡內的路由，因此可能需要花費幾分鐘才能完全應用。在這段時間內，可能無法在舊地址或新地址上從外部訪問該系統。 <p>如果所選系統已經分配了靜態地址，則可以通過從菜單中選擇“ <b>無”</b>選項將其刪除。 EC2將為系統選擇一個新的動態地址（該地址可能與原始地址不同），並在幾分鐘內分配它。 <p><footer>
