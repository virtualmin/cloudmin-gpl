<header> EC2帐户</header> EC2是Amazon提供的一项服务，用于创建在其网络上运行的虚拟系统，对此用户按机器小时收费。 Cloudmin可用于创建和管理EC2实例，就像在您自己的计算机上运行的Xen和VServer实例一样。但是，在通过EC2创建新的虚拟系统之前，您必须在Amazon注册一个帐户并提供您的账单详细信息。可以在<a href=https://aws-portal.amazon.com/gp/aws/developer/registration/index.html
target=_new>Amazon的AWS网站</a>上完成此操作。 <p>拥有EC2帐户后，请单击“ <b>添加EC2帐户”</b>链接在此页面上注册。要管理现有帐户，请在列表中单击其描述。要删除帐户，请选中它们旁边的复选框，然后单击“ <b>删除所选帐户”</b>按钮。但是，您将无法删除任何虚拟系统正在使用的帐户。 <p><footer>
