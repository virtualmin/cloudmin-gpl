<header> EC2帳戶</header> EC2是Amazon提供的一項服務，用於創建在其網絡上運行的虛擬系統，對此用戶按機器小時收費。 Cloudmin可用於創建和管理EC2實例，就像在您自己的計算機上運行的Xen和VServer實例一樣。但是，在通過EC2創建新的虛擬系統之前，您必須在Amazon註冊一個帳戶並提供您的賬單詳細信息。可以在<a href=https://aws-portal.amazon.com/gp/aws/developer/registration/index.html
target=_new>Amazon的AWS網站</a>上完成此操作。 <p>擁有EC2帳戶後，請單擊“ <b>添加EC2帳戶”</b>鏈接在此頁面上註冊。要管理現有帳戶，請在列表中單擊其描述。要刪除帳戶，請選中它們旁邊的複選框，然後單擊“ <b>刪除所選帳戶”</b>按鈕。但是，您將無法刪除任何虛擬系統正在使用的帳戶。 <p><footer>
