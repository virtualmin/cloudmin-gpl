<header>验证选项</header>本部分允许您设置Cloudmin用于通过SSH和Webmin登录到此受管系统的密码和用户名。请注意，更改这些密码实际上并<b>不会</b>更新系统上的<tt>root</tt>或Webmin密码-而是仅更改Cloudmin使用的凭据。 <p>如果新的登录详细信息不正确，您仍然可以保存它们，但是系统状态将更新以反映<b>登录失败</b> （例如<b>SSH登录失败</b>或<b>Webmin登录失败</b> ）。 <p>对于Cloudmin根本不应该尝试SSH的系统（可能是因为它们不受您的完全控制），请在<b>SSH登录模式</b>下选择<b>不尝试SSH登录</b>选项。但是，这将阻止Cloudmin执行大多数系统管理任务。 <p><footer>
