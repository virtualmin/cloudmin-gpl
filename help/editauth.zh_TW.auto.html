<header>驗證選項</header>本部分允許您設置Cloudmin用於通過SSH和Webmin登錄到此受管系統的密碼和用戶名。請注意，更改這些密碼實際上並<b>不會</b>更新系統上的<tt>root</tt>或Webmin密碼-而是僅更改Cloudmin使用的憑據。 <p>如果新的登錄詳細信息不正確，您仍然可以保存它們，但是系統狀態將更新以反映<b>登錄失敗</b> （例如<b>SSH登錄失敗</b>或<b>Webmin登錄失敗</b> ）。 <p>對於Cloudmin根本不應該嘗試SSH的系統（可能是因為它們不受您的完全控制），請在<b>SSH登錄模式</b>下選擇<b>不嘗試SSH登錄</b>選項。但是，這將阻止Cloudmin執行大多數係統管理任務。 <p><footer>
