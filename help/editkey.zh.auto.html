<header>编辑SSH密钥</header>该页面允许您更改在Cloudmin中注册的现有密钥的详细信息。除非您确定新的with可以在使用原始密钥的所有系统上运行，否则不要这样做，否则Cloudmin可能不再能够管理它们。 <p>可以使用“ <b>密钥描述”</b>字段安全地更改密钥的可读描述。要更改密钥本身，请将新的私有密钥文本粘贴到“ <b>私有密钥数据”</b>字段中，并将相应的公共密钥（如<tt>.ssh/authorized_keys</tt>文件中所示）粘贴到“ <b>公共密钥”</b>字段中。 <p>更改EC2注册密钥的公共或私有密钥文本不太可能正常工作，因为EC2存储自己的公共密钥副本，Cloudmin无法更新该副本。 <p><footer>
