<header>編輯SSH密鑰</header>該頁面允許您更改在Cloudmin中註冊的現有密鑰的詳細信息。除非您確定新的with可以在使用原始密鑰的所有系統上運行，否則不要這樣做，否則Cloudmin可能不再能夠管理它們。 <p>可以使用“ <b>密鑰描述”</b>字段安全地更改密鑰的可讀描述。要更改密鑰本身，請將新的私有密鑰文本粘貼到“ <b>私有密鑰數據”</b>字段中，並將相應的公共密鑰（如<tt>.ssh/authorized_keys</tt>文件中所示）粘貼到“ <b>公共密鑰”</b>字段中。 <p>更改EC2註冊密鑰的公共或私有密鑰文本不太可能正常工作，因為EC2存儲自己的公共密鑰副本，Cloudmin無法更新該副本。 <p><footer>
