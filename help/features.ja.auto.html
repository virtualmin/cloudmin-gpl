<header>デフォルトのVirtualmin機能</header>このページでは、Cloudminで作成された新しいVirtualminドメインに対してデフォルトで有効になる機能を制御できます。また、どのホストシステムがどの機能をサポートしているかを表示するため、広く利用可能な機能のみが有効になっていることを確認できます。 <p>デフォルトの機能を選択するには、[ <b>下で</b>選択]オプションを選択し、新しいドメインで使用する機能の横にあるチェックボックスをオンにします。 <b>ホームディレクトリ</b> 、 <b>管理ユーザー</b> 、および<b>Webminログイン</b>機能は、Webまたはメールホスティングの事前要件であるため、常に選択する必要があります。 <p><footer>
