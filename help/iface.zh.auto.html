<header>添加网络接口</header>该页面用于向虚拟系统添加新的网络接口，或用于更改现有接口的设置。添加时，您必须填写以下字段： <p><dl><dt> <b>主机系统接口</b> <dd>将在其下创建此新虚拟接口的父主机系统上的接口。通常，您将希望坚持使用主要的以太网连接，例如<tt>eth0</tt>或<tt>bge0</tt> 。 <dt> <b>IP地址</b> <dd>如果选择<b>自动分配</b> ，Cloudmin将从为主机系统定义的范围中选择一个空闲IP地址。否则，您可以输入自己选择的IP-只需确保未将其分配给任何其他系统即可。 <dt> <b>网路遮罩</b> <dd>通常可以保持不变，除非您需要使用与主机系统的主网络接口不同的掩码。 </dl><footer>
