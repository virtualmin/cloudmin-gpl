<header>添加網絡接口</header>該頁面用於向虛擬系統添加新的網絡接口，或用於更改現有接口的設置。添加時，您必須填寫以下字段： <p><dl><dt> <b>主機系統接口</b> <dd>將在其下創建此新虛擬接口的父主機系統上的接口。通常，您將希望堅持使用主要的以太網連接，例如<tt>eth0</tt>或<tt>bge0</tt> 。 <dt> <b>IP地址</b> <dd>如果選擇<b>自動分配</b> ，Cloudmin將從為主機系統定義的範圍中選擇一個空閒IP地址。否則，您可以輸入自己選擇的IP-只需確保未將其分配給任何其他系統即可。 <dt> <b>網路遮罩</b> <dd>通常可以保持不變，除非您需要使用與主機系統的主網絡接口不同的掩碼。 </dl><footer>
