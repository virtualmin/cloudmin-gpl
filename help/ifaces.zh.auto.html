<header>网络接口</header>该页面允许您在虚拟系统上创建和管理网络接口。尽管某些系统类型（例如Xen和KVM）可以在系统本身上创建新接口，但不建议这样做，因为它们可能会被IP欺骗防火墙Cloudmin设置阻止。因此，建议将此页面用于所有网络接口管理。 <p>此页面上的列表显示了虚拟系统上当前活动的所有网络接口，并为每个虚拟接口显示了使用它们的Virtualmin域（如果适用）。列表下方是用于更改系统默认网关的表单，其类型可以独立于主机进行管理。 <p>要调出新界面，请单击表格上方或下方的“ <b>添加新界面”</b>链接。要更改或删除现有接口的地址，只需单击其IP地址。 <p><footer>
