<header>網絡接口</header>該頁面允許您在虛擬系統上創建和管理網絡接口。儘管某些系統類型（例如Xen和KVM）可以在系統本身上創建新接口，但不建議這樣做，因為它們可能會被IP欺騙防火牆Cloudmin設置阻止。因此，建議將此頁面用於所有網絡接口管理。 <p>此頁面上的列表顯示了虛擬系統上當前活動的所有網絡接口，並為每個虛擬接口顯示了使用它們的Virtualmin域（如果適用）。列表下方是用於更改系統默認網關的表單，其類型可以獨立於主機進行管理。 <p>要調出新界面，請單擊表格上方或下方的“ <b>添加新界面”</b>鏈接。要更改或刪除現有接口的地址，只需單擊其IP地址。 <p><footer>
