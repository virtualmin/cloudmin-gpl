<header>仮想システムを移動</header>このコマンドを使用すると、Xenインスタンスまたは他のサポートされている仮想システムを、ホスティングサーバー間で転送できます。元のホストが過負荷になり、新しいホストシステムをオンラインにして負荷の一部を引き受けた場合に役立ちます。 <p>移動プロセス中、システムは通常一時的にシャットダウンされ、使用できなくなります。すべてのデータファイルが選択した新しいホストにコピーされ、仮想システムが再起動します。 <p>現在、システムのIPアドレスは移動プロセス中に変更されません。つまり、新しいホストシステムは元のホストシステムと同じサブネット上にある必要があります。 <p><footer>
