<header> OpenVZ主机系统</header>在Cloudmin可以使用Linux OpenVZ容器创建任何虚拟系统之前，您必须使用此页面注册OpenVZ将在其上运行的主机系统。 Cloudmin具有三层体系结构，其中主系统（运行Cloudmin Webmin界面的主系统）与承载OpenVZ容器的系统是分开的，而OpenVZ容器又与OpenVZ系统本身是分开的。 <p>在此处注册OpenVZ主机系统之前，必须首先使用左侧菜单“ <b>添加系统</b> ”下的“ <b>添加物理系统”</b>链接将其置于Cloudmin的控制之下。完成此操作后，从<b>Host system to add</b>菜单中选择系统，然后点击<b>Start Adding Host</b> 。 <p><footer>
