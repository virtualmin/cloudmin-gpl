<header> OpenVZ主機系統</header>在Cloudmin可以使用Linux OpenVZ容器創建任何虛擬系統之前，您必須使用此頁面註冊OpenVZ將在其上運行的主機系統。 Cloudmin具有三層體系結構，其中主系統（運行Cloudmin Webmin界面的主系統）與承載OpenVZ容器的系統是分開的，而OpenVZ容器又與OpenVZ系統本身是分開的。 <p>在此處註冊OpenVZ主機系統之前，必須首先使用左側菜單“ <b>添加系統</b> ”下的“ <b>添加物理系統”</b>鏈接將其置於Cloudmin的控制之下。完成此操作後，從<b>Host system to add</b>菜單中選擇系統，然後點擊<b>Start Adding Host</b> 。 <p><footer>
