<header> Pause system </header> Denne siden lar deg sette et virtuelt system i en suspendert tilstand, der det fremdeles kjører og konsumerer minne, men ikke kan bruke noen CPU-tid - på samme måte som å stanse en bærbar datamaskin. En gang pause kan menyelementet Un-pause brukes til å gjenopplive det igjen. <p><footer>
