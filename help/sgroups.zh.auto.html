<header> EC2安全组</header> EC2安全组本质上是一组防火墙规则，可以应用于多个EC2实例。每个组定义一个端口列表，以及可选的允许使用该组连接到实例的主机的列表。组还可以授予对其他组成员的访问权限，从而允许EC2系统之间进行通信。 <p>此页面列出了与您的EC2帐户关联的所有安全组。最初只有一个<tt>默认</tt>组，但是如果您创建了任何实例，也将有一个<tt>virtualmin</tt>组，该组允许访问用于Web和邮件托管的端口。 <p>要编辑现有组，只需单击其名称。要删除一个或多个未使用的组，请选中它们旁边的复选框，然后单击“ <b>删除”</b>按钮。 <p><footer>
