<header> EC2安全組</header> EC2安全組本質上是一組防火牆規則，可以應用於多個EC2實例。每個組定義一個端口列表，以及可選的允許使用該組連接到實例的主機的列表。組還可以授予對其他組成員的訪問權限，從而允許EC2系統之間進行通信。 <p>此頁面列出了與您的EC2帳戶關聯的所有安全組。最初只有一個<tt>默認</tt>組，但是如果您創建了任何實例，也將有一個<tt>virtualmin</tt>組，該組允許訪問用於Web和郵件託管的端口。 <p>要編輯現有組，只需單擊其名稱。要刪除一個或多個未使用的組，請選中它們旁邊的複選框，然後單擊“ <b>刪除”</b>按鈕。 <p><footer>
