<header>运行命令</header>该页面允许您在受管系统上执行Unix Shell命令，并查看其输出。但是，没有<tt>-y</tt>选项，您将无法运行任何要求用户输入的命令，例如<tt>vi</tt>或<tt>apt-get</tt> 。 <p>要仅运行命令，请在文本框中键入命令，然后按Enter。要重新运行旧命令，请从菜单中选择它，然后单击“ <b>执行上一个命令”</b>按钮-或单击“ <b>编辑上一个”</b>以在重新运行该命令之前对其进行修改。 <p>要清除此会话中运行的先前命令的输出历史记录，请点击<b>清除历史记录</b> 。要清除运行的命令菜单，请使用“ <b>清除命令”</b>按钮。 <p><footer>
