<header>運行命令</header>該頁面允許您在受管系統上執行Unix Shell命令，並查看其輸出。但是，沒有<tt>-y</tt>選項，您將無法運行任何要求用戶輸入的命令，例如<tt>vi</tt>或<tt>apt-get</tt> 。 <p>要僅運行命令，請在文本框中鍵入命令，然後按Enter。要重新運行舊命令，請從菜單中選擇它，然後單擊“ <b>執行上一個命令”</b>按鈕-或單擊“ <b>編輯上一個”</b>以在重新運行該命令之前對其進行修改。 <p>要清除此會話中運行的先前命令的輸出歷史記錄，請點擊<b>清除歷史記錄</b> 。要清除運行的命令菜單，請使用“ <b>清除命令”</b>按鈕。 <p><footer>
