<header>磁盘快照</header>在Cloudmin中，快照是组成系统的所有虚拟磁盘的副本。快照仅适用于存储在LVM卷组中并且托管在内核包含快照合并功能的系统上的磁盘。在创建快照后的任何时间，虚拟系统都可以恢复为拍摄快照时其磁盘所处的状态。 <p>此页面列出了与虚拟系统关联的所有快照（如果有）。要还原为快照，请单击该快照，然后单击“ <b>还原”</b>按钮。要删除一个或多个快照，请选中它们旁边的框，然后单击“ <b>删除”</b>按钮。 <p>可以使用页面底部的表单创建新的快照。如果将百分比设置为小于100的任何值，并且对虚拟系统文件系统的更改太多，则快照可能会完全填满。一旦发生这种情况，将不再可能恢复到快照中的状态。 <p><footer>
