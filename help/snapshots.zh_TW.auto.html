<header>磁盤快照</header>在Cloudmin中，快照是組成系統的所有虛擬磁盤的副本。快照僅適用於存儲在LVM卷組中並且託管在內核包含快照合併功能的系統上的磁盤。在創建快照後的任何時間，虛擬系統都可以恢復為拍攝快照時其磁盤所處的狀態。 <p>此頁面列出了與虛擬系統關聯的所有快照（如果有）。要還原為快照，請單擊該快照，然後單擊“ <b>還原”</b>按鈕。要刪除一個或多個快照，請選中它們旁邊的框，然後單擊“ <b>刪除”</b>按鈕。 <p>可以使用頁面底部的表單創建新的快照。如果將百分比設置為小於100的任何值，並且對虛擬系統文件系統的更改太多，則快照可能會完全填滿。一旦發生這種情況，將不再可能恢復到快照中的狀態。 <p><footer>
