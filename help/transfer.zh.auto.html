<header>传输档案</header>此页面可用于将文件上传到Cloudmin托管系统，或从系统下载文件。每个功能都有一个单独的标签： <dl><dt> <b>上传文件</b> <dd>上载时，文件可以来自运行Web浏览器的PC，也可以来自Cloudmin主系统，具体取决于您在“ <b>源文件”</b>字段中的选择。必须在“ <b>目标文件”或“目录”</b>字段中输入要在管理系统上上传到的文件或路径。 <p><dt> <b>下载文件</b> <dd>下载时，必须首先在“ <b>要下载</b>的<b>源文件”</b>字段中输入托管系统上现有文件的完整路径。要在浏览器中显示文件或将其保存在PC上，请选择<b>在浏览器中显示</b> 。要保存在Cloudmin master系统上，请选择<b>另存为Cloudmin master，</b>然后在相邻的文本框中输入文件或目录名称。 <p></dl><footer>
