<header>傳輸檔案</header>此頁面可用於將文件上傳到Cloudmin託管系統，或從系統下載文件。每個功能都有一個單獨的標籤： <dl><dt> <b>上傳文件</b> <dd>上載時，文件可以來自運行Web瀏覽器的PC，也可以來自Cloudmin主系統，具體取決於您在“ <b>源文件”</b>字段中的選擇。必須在“ <b>目標文件”或“目錄”</b>字段中輸入要在管理系統上上傳到的文件或路徑。 <p><dt> <b>下載文件</b> <dd>下載時，必須首先在“ <b>要下載</b>的<b>源文件”</b>字段中輸入託管系統上現有文件的完整路徑。要在瀏覽器中顯示文件或將其保存在PC上，請選擇<b>在瀏覽器中顯示</b> 。要保存在Cloudmin master系統上，請選擇<b>另存為Cloudmin master，</b>然後在相鄰的文本框中輸入文件或目錄名稱。 <p></dl><footer>
