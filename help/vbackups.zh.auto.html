<header>虚拟服务器备份</header>该页面使您可以配置Virtualmin虚拟服务器的备份或受管多个系统上的全局设置。它可用于在运行Virtualmin的所有计算机上设置一致的复制策略，而不必分别进行配置。要设置备份，请单击<b>添加新的Virtualmin备份</b>链接。如果已经定义了一些，请单击列表中的一个进行编辑，删除或运行。 <p>对于每种备份配置，您可以选择源系统，然后输入一个或多个目标路径。您还可以选择要包括的Virtualmin域或全局设置。可以将备份配置为定期运行（例如每天或每小时），也可以按需触发。对于每个配置，可以输入在发生故障时进行通知的电子邮件地址。 <p><footer>
