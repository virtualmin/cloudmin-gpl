<header>虛擬服務器備份</header>該頁面使您可以配置Virtualmin虛擬服務器的備份或受管多個系統上的全局設置。它可用於在運行Virtualmin的所有計算機上設置一致的複制策略，而不必分別進行配置。要設置備份，請單擊<b>添加新的Virtualmin備份</b>鏈接。如果已經定義了一些，請單擊列表中的一個進行編輯，刪除或運行。 <p>對於每種備份配置，您可以選擇源系統，然後輸入一個或多個目標路徑。您還可以選擇要包括的Virtualmin域或全局設置。可以將備份配置為定期運行（例如每天或每小時），也可以按需觸發。對於每個配置，可以輸入在發生故障時進行通知的電子郵件地址。 <p><footer>
