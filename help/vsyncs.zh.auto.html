<header>虚拟服务器复制</header>该页面允许您配置Virtualmin虚拟服务器的单向复制或多个系统之间的全局设置。它可用于镜像虚拟服务器，或将设置（如计划和模板）从主计算机分发到多个从属计算机。 <p>要设置复制，请单击<b>添加新的复制配置</b>链接。如果已经定义了一些，请单击列表中的一个进行编辑，删除或运行。 <p>对于每种复制配置，您可以选择源系统以及一个或多个目标系统。您还可以选择要复制的Virtualmin域或全局设置，以及要包含在这些域中的功能。 <p>可以将复制配置为定期运行（例如每天或每小时），也可以按需触发。对于每个配置，可以输入在发生故障时进行通知的电子邮件地址。 <p><footer>
