<header>虛擬服務器複製</header>該頁面允許您配置Virtualmin虛擬服務器的單向複製或多個系統之間的全局設置。它可用於鏡像虛擬服務器，或將設置（如計劃和模板）從主計算機分發到多個從屬計算機。 <p>要設置複製，請單擊<b>添加新的複製配置</b>鏈接。如果已經定義了一些，請單擊列表中的一個進行編輯，刪除或運行。 <p>對於每種複製配置，您可以選擇源系統以及一個或多個目標系統。您還可以選擇要復制的Virtualmin域或全局設置，以及要包含在這些域中的功能。 <p>可以將復製配置為定期運行（例如每天或每小時），也可以按需觸發。對於每個配置，可以輸入在發生故障時進行通知的電子郵件地址。 <p><footer>
